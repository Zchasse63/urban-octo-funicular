# Supabase Configuration for PodBrain
# https://supabase.com/docs/guides/cli/config

[api]
# Port to use for the API URL
port = 54321
# Schemas to expose in your API. Tables, views, and functions in these schemas will be available.
schemas = ["public", "extensions"]
# Extra schemas to add to the search_path
extra_search_path = ["public", "extensions"]
# The maximum number of rows to return from a view, table, or stored procedure
max_rows = 1000

[db]
# Port to use for the database URL
port = 54322
# The database major version to use
major_version = 15

[db.pooler]
enabled = false
# Port to use for the pooler URL
port = 54329
# Specifies when a server connection can be reused by other clients
pool_mode = "transaction"
# How many server connections to allow per user/database pair
default_pool_size = 20
# Maximum number of client connections allowed
max_client_conn = 100

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6 (default: IPv4)
# ip_version = "IPv6"

[studio]
enabled = true
# Port to use for Supabase Studio
port = 54323
# External URL of the API server that the frontend connects to
api_url = "http://127.0.0.1"

# Email testing server
[inbucket]
enabled = true
# Port to use for the email testing server web interface
port = 54324
# Uncomment to expose additional ports for SMTP and POP3
# smtp_port = 54325
# pop3_port = 54326

[storage]
enabled = true
# The maximum file size allowed (in bytes)
file_size_limit = "100MiB"

[auth]
enabled = true
# The base URL of your website
site_url = "http://127.0.0.1:3000"
# A list of redirect URLs that are permitted
additional_redirect_urls = ["https://127.0.0.1:3000"]
# How long tokens are valid for (in seconds)
jwt_expiry = 3600
# If disabled, the refresh token will never expire
enable_refresh_token_rotation = true
# How long refresh tokens are valid for (in seconds)
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project
enable_signup = true

[auth.email]
# Allow/disallow email signups
enable_signup = true
# If enabled, a user will be required to confirm email change
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in
enable_confirmations = false

[auth.sms]
# Allow/disallow phone signups
enable_signup = false
enable_confirmations = false

# External OAuth providers (disabled by default, configure when ready)
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# Overrides the default auth redirectUrl
redirect_uri = ""
# Overrides the default auth provider URL
url = ""

[analytics]
enabled = false
port = 54327
vector_port = 54328
# Configure one of the supported backends: postgres, bigquery
backend = "postgres"

# Experimental features (use with caution)
[experimental]
# Configures Postgres storage engine to use OrioleDB
# orioledb_version = ""
# Configure S3-compatible storage backend for the local database
# s3_host = "env(S3_HOST)"
# s3_region = "env(S3_REGION)"
# s3_access_key = "env(S3_ACCESS_KEY)"
# s3_secret_key = "env(S3_SECRET_KEY)"

[functions.verify_jwt]
enabled = false
